<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NumPy LM Course</title>
<style>/*@KATEX_CSS@*/</style>
<style>/*@STYLE@*/</style>
<script>
  // Apply a saved theme before first paint (avoids a light flash in dark mode).
  try {
    var t = JSON.parse(localStorage.getItem("course:theme"));
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">Skip to lesson</a>
<header class="topbar">
  <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Show lesson list" aria-expanded="false">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#">NumPy&nbsp;LM</a>
  <div class="current" id="current-label"></div>
  <div class="progress" title="Lessons passed">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text"></span>
  </div>
  <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle dark mode"></button>
</header>
<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Lessons"></nav>
  <div id="scrim" class="scrim" hidden></div>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="notice" class="notice" role="status" hidden></div>
<script type="application/json" id="course-data">/*@DATA@*/</script>
<script>/*@KATEX_JS@*/</script>
<script>/*@HLJS@*/</script>
<script>/*@APP@*/</script>
</body>
</html>
